[platformio]
default_envs = m5paper

[env:m5paper]
platform = espressif32
board = m5stack-fire
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5EPD@^0.1.5
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_M5STACK_Paper
board_build.partitions = large_spiffs_16MB.csv
board_build.filesystem = spiffs
test_ignore = test_weather

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<weather.cpp>
build_flags = -std=c++11
lib_deps = bblanchon/ArduinoJson@^7.0.0
